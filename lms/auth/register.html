<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | YR Tech Growth LMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/lms/assets/css/style.css">
  <link rel="stylesheet" href="/lms/assets/css/responsive.css">
</head>
<body class="lms-body d-flex flex-column min-vh-100 justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card lms-card p-4 p-md-5 shadow-lg">
          <div class="text-center mb-4">
            <a href="/lms/index.html"><img src="/assets/images/yr-tech-growth-logo.webp" alt="Logo" class="lms-brand-logo mb-3"></a>
            <h2 class="h4 text-white fw-bold">Create Account</h2>
            <p class="text-muted small">Join YR Tech Growth LMS & start learning for free</p>
          </div>

          <form id="lmsRegisterForm">
            <div class="mb-3">
              <label for="name" class="form-label text-light small fw-semibold">Full Name</label>
              <input type="text" class="form-control lms-input" id="name" required placeholder="Muhammad Yaseen">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label text-light small fw-semibold">Email Address</label>
              <input type="email" class="form-control lms-input" id="email" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label text-light small fw-semibold">Password</label>
              <input type="password" class="form-control lms-input" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-lms-gold w-100 py-2 mt-2">
              <i class="fa-solid fa-user-plus me-2"></i> Register Account
            </button>
          </form>

          <hr class="border-secondary opacity-25 my-4">
          <div class="text-center small text-muted">
            Already have an account? <a href="/lms/auth/login.html" class="gold-text fw-semibold text-decoration-none">Login Here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/lms/assets/js/api.js"></script>
  <script src="/lms/assets/js/main.js"></script>
  <script src="/lms/assets/js/auth.js"></script>
</body>
</html>
