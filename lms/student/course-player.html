<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Player | YR Tech Growth LMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/lms/assets/css/style.css">
  <link rel="stylesheet" href="/lms/assets/css/player-style.css">
  <link rel="stylesheet" href="/lms/assets/css/responsive.css">
</head>
<body class="lms-body">
  <!-- LMS Player Navbar -->
  <nav class="navbar navbar-expand-lg lms-navbar sticky-top py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center" href="/lms/student/dashboard.html">
        <img src="/assets/images/yr-tech-growth-logo.webp" alt="Logo" class="lms-brand-logo me-2">
        <span class="fw-bold gold-gradient-text">Meta Ads Mastery 2026</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="/lms/student/quiz/quiz.html?courseId=1" class="btn btn-sm btn-lms-gold"><i class="fa-solid fa-list-check me-1"></i> Take Module Quiz</a>
        <a href="/lms/student/my-courses.html" class="btn btn-sm btn-lms-outline"><i class="fa-solid fa-arrow-left me-1"></i> My Courses</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-3 px-4">
    <div class="row g-3">
      <!-- Player View -->
      <div class="col-lg-8 col-xl-9">
        <div class="player-container mb-3">
          <iframe id="lmsVideoFrame" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="LMS Lesson Player" class="w-100 h-100 border-0" allowfullscreen></iframe>
        </div>
        <div class="card lms-card p-3">
          <div class="d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="h5 text-white fw-bold mb-0" id="currentLessonTitle">Module 1: Introduction to Meta Ads Platform 2026</h2>
            <button class="btn btn-sm btn-lms-gold" onclick="showLmsToast('Lesson marked as completed!')">
              <i class="fa-solid fa-circle-check me-1"></i> Mark as Completed
            </button>
          </div>
          <hr class="border-secondary opacity-25 my-3">
          <p class="text-muted small mb-0">In this lesson, you will learn the foundational architecture of Meta Business Manager, Pixel telemetry, and server-side tracking.</p>
        </div>
      </div>

      <!-- Lesson Playlist Sidebar -->
      <div class="col-lg-4 col-xl-3">
        <div class="card lms-card p-0 h-100">
          <div class="lms-card-header">
            <h3 class="h6 text-white fw-bold mb-0"><i class="fa-solid fa-list gold-text me-2"></i> Course Playlist</h3>
          </div>
          <div id="lessonPlaylist" class="lesson-playlist">
            <!-- Dynamically Rendered via player.js -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/lms/assets/js/api.js"></script>
  <script src="/lms/assets/js/main.js"></script>
  <script src="/lms/assets/js/player.js"></script>
</body>
</html>
