<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module Quiz | YR Tech Growth LMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/lms/assets/css/style.css">
  <link rel="stylesheet" href="/lms/assets/css/quiz-style.css">
</head>
<body class="lms-body">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <span class="lms-badge"><i class="fa-solid fa-list-check me-1"></i> Assessment Mode</span>
      <div class="quiz-timer"><i class="fa-solid fa-clock me-1"></i> 09:45</div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card lms-card p-4 p-md-5" id="quizBox">
          <small class="gold-text fw-bold text-uppercase d-block mb-1" id="quizStepText">Question 1 of 3</small>
          <h2 class="h4 text-white fw-bold mb-4" id="quizQuestionTitle">Question loading...</h2>

          <div id="quizOptionsContainer" class="mb-4">
            <!-- Rendered by quiz.js -->
          </div>

          <div class="d-flex justify-content-between">
            <a href="/lms/student/course-player.html?id=1" class="btn btn-lms-outline">Exit Quiz</a>
            <button onclick="submitNextQuiz()" class="btn btn-lms-gold">Next Question <i class="fa-solid fa-arrow-right ms-1"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/lms/assets/js/api.js"></script>
  <script src="/lms/assets/js/main.js"></script>
  <script src="/lms/assets/js/quiz.js"></script>
</body>
</html>
