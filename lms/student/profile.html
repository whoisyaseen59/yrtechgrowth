<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | YR Tech Growth LMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/lms/assets/css/style.css">
  <link rel="stylesheet" href="/lms/assets/css/responsive.css">
</head>
<body class="lms-body">
  <nav class="navbar navbar-expand-lg lms-navbar sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/lms/student/dashboard.html">
        <img src="/assets/images/yr-tech-growth-logo.webp" alt="Logo" class="lms-brand-logo me-2">
        <span class="fw-bold gold-gradient-text">Profile Settings</span>
      </a>
      <div class="ms-auto">
        <a href="/lms/student/dashboard.html" class="btn btn-sm btn-lms-outline"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card lms-card p-4">
          <h2 class="h4 text-white fw-bold mb-3"><i class="fa-solid fa-user-gear gold-text me-2"></i> Account Details</h2>
          <form id="profileForm" onsubmit="event.preventDefault(); showLmsToast('Profile saved successfully!');">
            <div class="mb-3">
              <label class="form-label text-light small fw-semibold">Full Name</label>
              <input type="text" class="form-control lms-input" id="profileName" value="Muhammad Yaseen">
            </div>
            <div class="mb-3">
              <label class="form-label text-light small fw-semibold">Email Address</label>
              <input type="email" class="form-control lms-input" id="profileEmail" value="student@yrtechgrowth.com" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label text-light small fw-semibold">Agency / Business Name</label>
              <input type="text" class="form-control lms-input" value="YR Tech Growth Partner">
            </div>
            <button type="submit" class="btn btn-lms-gold mt-2"><i class="fa-solid fa-floppy-disk me-1"></i> Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="lms-footer text-center mt-5">
    <div class="container">
      <p class="mb-0 small text-secondary">&copy; 2026 YR Tech Growth LMS. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/lms/assets/js/api.js"></script>
  <script src="/lms/assets/js/main.js"></script>
</body>
</html>
